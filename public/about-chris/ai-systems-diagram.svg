<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="aisys-title aisys-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="aisys-title">Teamulate AI systems flow</title>
  <desc id="aisys-desc">Chris (human) to Strategos (Head of Marketing) to eleven specialist agents to Guardian QA to human approval gates. Strategy, spend, and brand stay with Chris; agents run the routine work.</desc>

  <rect width="960" height="300" rx="16" fill="#f5f4fb"/>

  <text x="30" y="42" font-size="12" font-weight="700" letter-spacing="1.7" fill="#5b47f0">AI SYSTEMS</text>
  <text x="30" y="72" font-size="20" font-weight="700" fill="#0b1631">Human oversight &#8594; agent execution</text>

  <!-- 1. Chris -->
  <g transform="translate(30 110)">
    <rect width="150" height="120" rx="12" fill="#0b1631"/>
    <circle cx="75" cy="34" r="16" fill="#5b47f0"/>
    <circle cx="75" cy="30" r="6" fill="#ffffff"/>
    <path d="M64 46c1.5-6 5.5-9 11-9s9.5 3 11 9" fill="#ffffff"/>
    <text x="75" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Chris</text>
    <text x="75" y="105" text-anchor="middle" font-size="12" fill="#b9b6d6">Human</text>
  </g>

  <path d="M192 170h20m0 0-6-6m6 6-6 6" fill="none" stroke="#5b47f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. Strategos -->
  <g transform="translate(226 110)">
    <rect x="1" y="1" width="148" height="118" rx="12" fill="#ffffff" stroke="#5b47f0" stroke-width="2"/>
    <rect x="57" y="18" width="36" height="36" rx="9" fill="#eceafa"/>
    <path d="M75 25l3.6 7.4 8.1 1.2-5.9 5.7 1.4 8.1-7.2-3.8-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z" fill="#5b47f0"/>
    <text x="75" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1631">Strategos</text>
    <text x="75" y="105" text-anchor="middle" font-size="12" fill="#64748b">Head of Marketing</text>
  </g>

  <path d="M388 170h20m0 0-6-6m6 6-6 6" fill="none" stroke="#5b47f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. 11 agents -->
  <g transform="translate(422 110)">
    <rect x="1" y="1" width="148" height="118" rx="12" fill="#ffffff" stroke="#3b6ef5" stroke-width="2"/>
    <circle cx="33" cy="36" r="10" fill="#3b6ef5"/>
    <circle cx="75" cy="36" r="10" fill="#5b47f0"/>
    <circle cx="117" cy="36" r="10" fill="#19a9b8"/>
    <text x="75" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1631">11 agents</text>
    <text x="75" y="105" text-anchor="middle" font-size="12" fill="#64748b">Specialists</text>
  </g>

  <path d="M584 170h20m0 0-6-6m6 6-6 6" fill="none" stroke="#5b47f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4. Guardian -->
  <g transform="translate(618 110)">
    <rect x="1" y="1" width="148" height="118" rx="12" fill="#ffffff" stroke="#2da65a" stroke-width="2"/>
    <path d="M75 14l17 6.5v12.5c0 10.4-7 18.7-17 22.7-10-4-17-12.3-17-22.7V20.5z" fill="#e6f6ec" stroke="#2da65a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M67.5 35l5 5 10-11" fill="none" stroke="#2da65a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1631">Guardian</text>
    <text x="75" y="105" text-anchor="middle" font-size="12" fill="#64748b">QA / brand</text>
  </g>

  <path d="M780 170h20m0 0-6-6m6 6-6 6" fill="none" stroke="#5b47f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 5. Approvals -->
  <g transform="translate(814 110)">
    <rect width="116" height="120" rx="12" fill="#0b1631"/>
    <rect x="40" y="20" width="36" height="30" rx="7" fill="#5b47f0"/>
    <path d="M50 35l5.5 5.5L66.5 29" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Approvals</text>
    <text x="58" y="105" text-anchor="middle" font-size="12" fill="#b9b6d6">Human gates</text>
  </g>

  <text x="30" y="276" font-size="13" fill="#64748b">Strategy, spend, and brand stay with Chris. Agents run the routine work.</text>
</svg>

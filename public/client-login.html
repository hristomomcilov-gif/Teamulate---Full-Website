<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Client Login | Teamulate</title>
  <style>
    :root { --ink:#0b1631; --muted:#64748b; --bg:#f5f4fb; --surface:#fff; --line:#dbe3f0; --brand:#5b47f0; --brand-hover:#4a38d8; --err:#dc2626; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    .top { display:flex; align-items:center; justify-content:space-between; padding:0 20px; height:64px; background:var(--surface); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:800; font-size:1.15rem; letter-spacing:-0.01em; }
    .brand svg { height:32px; width:32px; }
    .back { color:var(--brand); text-decoration:none; font-weight:600; font-size:.9rem; }
    .back:hover { text-decoration:underline; }
    .wrap { min-height:calc(100vh - 64px); display:flex; align-items:flex-start; justify-content:center; padding:56px 24px; }
    .card { width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 12px 36px rgba(11,22,49,.08); }
    .eyebrow { margin:0 0 6px; font-size:.7rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--brand); }
    h1 { font-size:1.5rem; margin:0 0 8px; letter-spacing:-0.01em; }
    .lead { color:var(--muted); margin:0 0 20px; line-height:1.5; font-size:.9rem; }
    label { display:block; font-size:.875rem; font-weight:500; margin:0 0 4px; color:var(--ink); }
    input { width:100%; min-height:44px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:0 12px; font-size:.9rem; font-family:inherit; margin-bottom:14px; }
    input:focus { outline:none; border-color:var(--brand); }
    button { width:100%; min-height:44px; border:0; border-radius:999px; background:var(--brand); color:#fff; font-weight:600; font-size:.9rem; font-family:inherit; cursor:pointer; transition:background-color .2s; }
    button:hover { background:var(--brand-hover); }
    .err { color:var(--err); font-size:.85rem; font-weight:500; min-height:1.3em; margin:0 0 10px; }
  </style>
</head>
<body>
  <div class="top">
    <a class="brand" href="/">
      <svg viewBox="49 50 205 207" aria-hidden="true">
        <defs>
          <linearGradient id="tmg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6C59F4"/>
            <stop offset="1" stop-color="#5B47F0"/>
          </linearGradient>
        </defs>
        <rect x="49" y="50" width="205" height="207" rx="43" fill="url(#tmg)"/>
        <path fill="#FFFFFF" d="M91 100H199C203 100 205 103 205 107V118C205 123 202 126 198 126H92C88 126 86 123 86 119V107C86 103 88 100 91 100Z"/>
        <path fill="#FFFFFF" d="M121 143H156C167 143 173 149 173 160V210C173 213 171 214 168 212L143 198C134 193 131 188 131 178V164C131 159 128 157 123 155L118 153C115 152 113 150 113 147C113 145 116 143 121 143Z"/>
      </svg>
      Teamulate
    </a>
    <a class="back" href="/">&larr; Back to site</a>
  </div>
  <div class="wrap">
    <div class="card">
      <p class="eyebrow">Client login</p>
      <h1>Sign in to your dashboard</h1>
      <p class="lead">Enter the username and password you received at onboarding.</p>
      <p class="err" id="err"></p>
      <form method="post" action="/auth/login.php" autocomplete="on">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Sign in</button>
      </form>
    </div>
  </div>
  <script>
    if (/[?&]err=1/.test(location.search)) {
      document.getElementById('err').textContent = 'Wrong username or password.';
    }
  </script>
</body>
</html>

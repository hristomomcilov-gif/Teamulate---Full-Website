<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Teamulate blog OG</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #6c59f4;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .frame {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 48px;
        background: #6c59f4;
      }
      .card {
        box-sizing: border-box;
        height: 534px;
        padding: 48px 56px;
        background: #ffffff;
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .logo {
        width: 280px;
        height: auto;
        display: block;
      }
      .eyebrow {
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6c59f4;
      }
      h1 {
        margin: 0;
        font-size: 52px;
        line-height: 1.1;
        font-weight: 800;
        color: #0b1631;
        max-width: 920px;
      }
      .dek {
        margin: 16px 0 0;
        font-size: 22px;
        line-height: 1.35;
        color: #64748b;
        max-width: 860px;
      }
      .meta {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: #0b1631;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="card">
        <img class="logo" src="../../public/brand/teamulate-logo.svg" alt="Teamulate" />
        <div>
          <p class="eyebrow">Blog</p>
          <h1>11 Human Hires vs. 11 AI Specialists</h1>
          <p class="dek">The cost, capacity, consistency and control trade-offs behind a modern marketing department.</p>
        </div>
        <p class="meta">August 2026 · United States + Canada</p>
      </div>
    </div>
  </body>
</html>
